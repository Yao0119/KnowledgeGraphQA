<!doctype html>
<!-- lang 之前是空的：中文界面没有声明语言，屏幕阅读器会用英文发音规则读中文 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color" name="theme-color" content="#F2F2F2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="恶意软件知识图谱问答与预测系统" />
    <script>
      (() => {
        const root = document.documentElement;
        let preferences = {};
        let userId = "anonymous";

        try {
          const user = JSON.parse(localStorage.getItem("user") || "null");
          if (user?.id) userId = user.id;
          const raw = localStorage.getItem(`kg_preferences:${userId}`);
          if (raw) preferences = JSON.parse(raw) || {};
        } catch {
          preferences = {};
        }

        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const theme = preferences.theme === "system"
          ? (prefersDark ? "dark" : "light")
          : (preferences.theme || (prefersDark ? "dark" : "light"));

        root.dataset.theme = theme;
        root.dataset.themePreference = preferences.theme || "system";
        root.dataset.fontScale = preferences.fontScale || "standard";
        root.dataset.density = preferences.density || "comfortable";
        root.dataset.reduceMotion = preferences.reduceMotion ? "true" : "false";
        root.style.colorScheme = theme;

        const themeColor = document.getElementById("theme-color");
        const colorScheme = document.querySelector('meta[name="color-scheme"]');
        if (themeColor) themeColor.content = theme === "dark" ? "#171717" : "#F2F2F2";
        if (colorScheme) colorScheme.content = theme;
      })();
    </script>
    <style>
      html {
        background: #f2f2f2;
      }
      html[data-theme="dark"] {
        background: #171717;
      }
      html,
      body,
      #root {
        min-height: 100%;
      }
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        background: #f2f2f2;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 180ms ease;
      }
      html[data-theme="dark"] .boot-screen {
        background: #171717;
      }
      .boot-screen.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      html[data-theme="dark"] .boot-screen {
        color: #f5f5f5;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(28, 28, 30, 0.14);
        border-top-color: #1c1c1e;
        border-radius: 50%;
        animation: boot-spin 720ms linear infinite;
      }
      html[data-theme="dark"] .boot-spinner {
        border-color: rgba(255, 255, 255, 0.16);
        border-top-color: #f5f5f5;
      }
      .boot-title {
        font-size: 15px;
        font-weight: 600;
      }
      .boot-status {
        font-size: 12px;
        opacity: 0.62;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      html[data-reduce-motion="true"] .boot-spinner {
        animation-duration: 1.8s;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen {
          transition-duration: 0.01ms;
        }
        .boot-spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
    <!-- 内联 SVG 图标：原来没有 favicon，每次加载都会产生一条 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231E40AF'/><path d='M8 8.5 13.5 14M24 8.5 18.5 14M8 23.5 13.5 18M24 23.5 18.5 18' stroke='%2393C5FD' stroke-width='1.8' fill='none'/><circle cx='6' cy='7' r='2.8' fill='%2393C5FD'/><circle cx='26' cy='7' r='2.8' fill='%2393C5FD'/><circle cx='6' cy='25' r='2.8' fill='%2393C5FD'/><circle cx='26' cy='25' r='2.8' fill='%2393C5FD'/><circle cx='16' cy='16' r='4.2' fill='white'/></svg>"
    />
    <title>知识图谱安全分析平台</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-screen" class="boot-screen" role="status" aria-live="polite">
      <span class="boot-spinner" aria-hidden="true"></span>
      <span class="boot-title">知识图谱安全分析平台</span>
      <span class="boot-status">正在加载工作区</span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
